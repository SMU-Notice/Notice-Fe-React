<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이메일 인증</title>
    <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: white;
      font-family: 'Arial', sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .popup {
      padding: 40px 20px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      position: relative;
      text-align: center;
    }

    .popup h2 {
      margin: 0 0 30px;
      font-size: 24px;
      font-weight: bold;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 20px;
      cursor: pointer;
      color: #333;
    }

    .input-container {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
      margin-bottom: 24px;
      justify-content: space-between;
    }

    .input-container input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
      color: #333;
    }

    .input-container input::placeholder {
      color: #aaa;
    }

    .timer {
      font-size: 14px;
      color: #999;
      margin-left: 10px;
      white-space: nowrap;
    }

    .verify-button {
      background-color: #0f1e50;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="close-btn" onclick="window.close()">✕</div>
    <h2>이메일 인증</h2>
    <div class="input-container">
      <input type="text" id="authInput" placeholder="인증번호를 입력해주세요." />
      <div class="timer" id="timer">03:00</div>
    </div>
    <button class="verify-button" id="submitBtn">인증하기</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email");
    const token = params.get("token");

    // 타이머
    let time = 180;
    const timerEl = document.getElementById("timer");
    const interval = setInterval(() => {
      const min = String(Math.floor(time / 60)).padStart(2, "0");
      const sec = String(time % 60).padStart(2, "0");
      timerEl.textContent = `${min}:${sec}`;
      time--;
      if (time < 0) {
        clearInterval(interval);
        timerEl.textContent = "만료됨";
        document.getElementById("submitBtn").disabled = true;
      }
    }, 1000);

    // 인증 요청
    document.getElementById("submitBtn").onclick = () => {
      const code = document.getElementById("authInput").value.trim();
      if (!code) {
        alert("인증번호를 입력해주세요.");
        return;
      }

      fetch("https://test.smu-notice.kr/api/email/verification/verify", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ email, verificationCode: code }),
        credentials: "include"
      })
        .then(res => {
          if (!res.ok) throw new Error("검증 실패");
          return res.json();
        })
        .then(() => {
          alert("✅ 인증 성공!");
          window.close();
        })
        .catch(err => {
          alert("❌ 인증 실패: " + err.message);
        });
    };
  </script>
</body>
</html>
